services:
  - type: web
    name: payflow-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYFLOW_MFA_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION_SECONDS
        value: "900"
      - key: JWT_REFRESH_EXPIRATION_SECONDS
        value: "604800"
      - key: PAYFLOW_DEFAULT_INITIAL_BALANCE
        value: "10000.00"
      - key: PAYFLOW_SCHEDULED_TRANSFERS_POLL_MS
        value: "30000"
      - key: FRONTEND_URL
        value: https://payflow-alpha-brown.vercel.app
