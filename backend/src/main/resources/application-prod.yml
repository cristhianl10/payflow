spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      data-source-properties:
        prepareThreshold: 0
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
payflow:
  transfer:
    max-per-operation: ${TRANSFER_MAX_PER_OPERATION:7500.00}
    daily-limit: ${TRANSFER_DAILY_LIMIT:15000.00}
  allowed-origins: ${FRONTEND_URL}
  auth:
    secret: ${JWT_SECRET}
    secure-cookie: true
  email:
    password-reset-token-seconds: ${PASSWORD_RESET_TOKEN_SECONDS:1800}
    frontend-url: ${FRONTEND_URL}
    delivery-mode: ${EMAIL_DELIVERY_MODE:log}
    from: ${EMAIL_FROM:no-reply@payflow.local}
