spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
payflow:
  allowed-origins: ${FRONTEND_URL}
  auth:
    secret: ${JWT_SECRET}
    secure-cookie: true
  email:
    frontend-url: ${FRONTEND_URL}
    delivery-mode: ${EMAIL_DELIVERY_MODE:log}
    from: ${EMAIL_FROM:no-reply@payflow.local}
