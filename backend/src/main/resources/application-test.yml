spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
payflow:
  transfer:
    max-per-operation: ${TRANSFER_MAX_PER_OPERATION:7500.00}
    daily-limit: ${TRANSFER_DAILY_LIMIT:15000.00}
  scheduled-transfers:
    poll-ms: 3600000
  allowed-origins: http://localhost:5173
  email:
    password-reset-token-seconds: ${PASSWORD_RESET_TOKEN_SECONDS:1800}
    frontend-url: http://localhost:5173
    delivery-mode: log
