spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow_dev_only}
payflow:
  transfer:
    max-per-operation: ${TRANSFER_MAX_PER_OPERATION:7500.00}
    daily-limit: ${TRANSFER_DAILY_LIMIT:15000.00}
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  email:
    password-reset-token-seconds: ${PASSWORD_RESET_TOKEN_SECONDS:1800}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    delivery-mode: ${EMAIL_DELIVERY_MODE:log}
    from: ${EMAIL_FROM:no-reply@payflow.local}
