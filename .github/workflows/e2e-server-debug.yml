name: E2E server debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright with webserver diagnostics
        env:
          DEBUG: pw:webserver
        run: npm run test:browser

  backend-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start browser test backend and print logs
        run: |
          set +e
          ./mvnw -B -ntp test-compile spring-boot:test-run -Dspring-boot.run.main-class=com.payflow.BrowserTestApplication > /tmp/payflow-browser-backend.log 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/actuator/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              kill "$PID" || true
              wait "$PID" || true
              exit 0
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat /tmp/payflow-browser-backend.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/payflow-browser-backend.log
          kill "$PID" || true
          exit 1
