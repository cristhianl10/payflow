name: Format debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write src/features/transfers/SendPage.tsx
          git diff -- src/features/transfers/SendPage.tsx
